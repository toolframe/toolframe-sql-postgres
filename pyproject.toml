[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-storage-postgres"
version = "0.1.0"
description = "Managed PostgreSQL stores for Toolframe plugins"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk==0.3.0", "psycopg[binary]>=3.3,<4", "pglast>=8.4,<9"]

[project.entry-points."toolframe.plugins"]
storage-postgres = "toolframe_storage_postgres.plugin:plugin"

[project.scripts]
toolframe-postgres = "toolframe_storage_postgres.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
compatibility = ["toolframe-auth==0.2.0", "toolframe-mcp-auth==0.2.0", "toolframe-oidc-auth==0.2.0", "toolframe-demo-entry-register==0.3.0"]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }
toolframe-auth = { path = "../toolframe-auth", editable = true }
toolframe-mcp-auth = { path = "../toolframe-mcp-auth", editable = true }
toolframe-oidc-auth = { path = "../toolframe-oidc-auth", editable = true }
toolframe-demo-entry-register = { path = "../toolframe-demo-entry-register", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-sql-postgres"
version = "0.2.1"
description = "Managed PostgreSQL stores for Toolframe plugins"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk>=0.4,<0.5", "psycopg[binary]>=3.3,<4", "pglast==8.4"]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-sql-postgres"
Repository = "https://github.com/toolframe/toolframe-sql-postgres"
Documentation = "https://github.com/toolframe/toolframe-sql-postgres#readme"
Issues = "https://github.com/toolframe/toolframe-sql-postgres/issues"

[project.entry-points."toolframe.plugins"]
sql-postgres = "toolframe_sql_postgres.plugin:plugin"

[project.scripts]
toolframe-postgres = "toolframe_sql_postgres.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]
compatibility = ["toolframe-auth==0.3.1", "toolframe-mcp-auth==0.3.1", "toolframe-oidc-auth==0.3.1", "toolframe-demo-entry-register==0.4.1"]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }
toolframe-auth = { path = "../toolframe-auth", editable = true }
toolframe-mcp-auth = { path = "../toolframe-mcp-auth", editable = true }
toolframe-oidc-auth = { path = "../toolframe-oidc-auth", editable = true }
toolframe-demo-entry-register = { path = "../toolframe-demo-entry-register", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
